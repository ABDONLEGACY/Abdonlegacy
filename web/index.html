<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SceneForge Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3ESF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">SF</div>
      <div><div class="brand-name">Scene<span>Forge</span></div><div class="brand-sub">Video Studio</div></div>
    </div>
    <button class="new-btn" id="side-new"><span data-icon="plus-circle"></span><span>New Project</span></button>
    <nav class="nav" id="nav">
      <a href="#/workspace" data-page="workspace"><span data-icon="video"></span><span>Studio Workspace</span></a>
      <a href="#/projects" data-page="projects"><span data-icon="folder"></span><span>Projects</span></a>
      <a href="#/history" data-page="history"><span data-icon="history"></span><span>Render History</span></a>
      <a href="#/presets" data-page="presets"><span data-icon="sparkles"></span><span>Presets</span></a>
      <div class="sep"></div>
      <a href="#/settings" data-page="settings"><span data-icon="settings"></span><span>Settings</span></a>
    </nav>
    <div class="side-foot">
      <div class="local-card">
        <div class="t"><i></i>LOCAL MODE</div>
        <div class="d">Runs on this laptop. Nothing is uploaded.</div>
      </div>
      <div class="version" id="version"></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="title-pill" id="title-pill"><input id="title-input" placeholder="No project open" maxlength="120"><span data-icon="edit"></span></div>
      <button class="btn primary" id="top-save"><span data-icon="save"></span>Save</button>
      <button class="btn" id="top-new"><span data-icon="plus"></span>New</button>
      <div class="spacer"></div>
      <a class="btn" href="#/projects"><span data-icon="grid"></span>Projects</a>
      <a class="btn" href="#/presets"><span data-icon="sparkles"></span>Presets</a>
      <a class="btn" href="#/history"><span data-icon="film"></span>Renders</a>
      <a class="btn icon" href="#/settings" title="Settings"><span data-icon="settings"></span></a>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
